name: Release

# 推送版本 tag（如 v0.3.0）时自动发布；也可在 Actions 页手动触发
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # tag 名去掉 v 前缀作为版本号（非 tag 手动触发时回退 0.0.0）
      - name: Compute version
        id: ver
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          case "$V" in *[!0-9.]*) V="0.0.0";; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Publish (self-contained single file)
        run: >
          dotnet publish src/AdbToolkit
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }}

      - name: Zip portable package
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory -Force | Out-Null
          Compress-Archive `
            -Path "src/AdbToolkit/bin/Release/net8.0-windows/win-x64/publish/*" `
            -DestinationPath "dist/AdbForge-${{ steps.ver.outputs.version }}-portable.zip" `
            -Force

      - name: Compute SHA256
        id: sha
        shell: pwsh
        run: |
          $zip = Get-ChildItem "dist/AdbForge-*-portable.zip" | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash
          "sha=$hash"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "zipname=$($zip.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # 更新源：把 latest.json 推到 feed 分支，
      # 应用内「检查更新」的 URL 固定填：
      #   https://raw.githubusercontent.com/<用户>/<仓库>/feed/latest.json
      - name: Update feed branch
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir feed-repo && cd feed-repo
          git init -b feed
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '{"version":"%s","url":"https://github.com/%s/releases/download/v%s/AdbForge-%s-portable.zip","notes":"%s"}' \
            "$V" "${{ github.repository }}" "$V" "$V" "See release page" > latest.json
          git add latest.json
          git commit -m "feed v$V"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin feed --force

      - name: Create Release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AdbForge-*-portable.zip
            dist/latest.json
          body: |
            ## 卓匠 AdbForge ${{ steps.ver.outputs.version }}

            **下载**：下方 Assets 中的 zip，解压即用（自包含单文件，无需安装 .NET）

            **SHA256**：`${{ steps.sha.outputs.sha }}`

            > 首次运行若出现 SmartScreen 提示，选择「更多信息 → 仍要运行」（未做代码签名，属正常现象）
          generate_release_notes: true
